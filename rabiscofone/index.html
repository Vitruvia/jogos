<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabiscofone</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #ddd6fe 100%);
      min-height: 100vh;
    }
    .container { max-width: 700px; margin: 0 auto; padding: 20px; }
    .btn {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      transition: transform 0.2s;
      font-family: Georgia, serif;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }
    .btn-secondary {
      background: linear-gradient(135deg, #64748b 0%, #475569 100%);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .info-box {
      background: rgba(255,255,255,0.9);
      padding: 25px;
      border-radius: 16px;
      margin: 20px 0;
      border: 3px solid #7c3aed;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .prompt-box {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      padding: 25px;
      border-radius: 16px;
      margin: 20px 0;
      border: 3px solid #f59e0b;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 { 
      color: #5b21b6; 
      text-align: center; 
      font-size: 48px; 
      margin: 20px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    h2 { color: #5b21b6; font-size: 28px; margin-top: 0; }
    h3 { color: #6d28d9; font-size: 22px; }
    .rules-list {
      list-style: none;
      padding: 0;
      counter-reset: step;
    }
    .rules-list li {
      counter-increment: step;
      margin: 15px 0;
      padding-left: 40px;
      position: relative;
      line-height: 1.6;
    }
    .rules-list li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 0;
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .round-indicator {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.3);
    }
    .round-number {
      font-size: 72px;
      font-weight: bold;
      margin: 10px 0;
    }
    .round-label {
      font-size: 24px;
      opacity: 0.9;
    }
    .player-count {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #5b21b6;
      margin: 20px 0;
    }
    .prompt-text {
      font-size: 22px;
      font-weight: bold;
      color: #92400e;
      text-align: center;
      line-height: 1.6;
      margin: 20px 0;
    }
    .warning {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      color: #92400e;
    }
    .success {
      background: #d1fae5;
      border: 2px solid #10b981;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;

    const PROMPTS = [
      "Imagine algo que muda de forma toda hora, como você descreveria?",
      "Fale sobre uma viagem inesperada para um lugar que ninguém conhece.",
      "Descreva um objeto comum com poderes mágicos secretos.",
      "Conte sobre uma surpresa que ninguém esperava.",
      "Imagine um som que anuncia algo importante.",
      "Fale de uma amizade estranha entre dois personagens muito diferentes.",
      "Descreva uma ação rápida que muda tudo numa história.",
      "Pense em algo que você sempre quis fazer, mas nunca contou pra ninguém.",
      "Conte sobre uma festa muito estranha que aconteceu em um lugar improvável.",
      "Descreva uma coisa que não deveria existir, mas existe.",
      "Imagine um lugar onde as regras são completamente diferentes do normal.",
      "Fale sobre um segredo que pode mudar o mundo.",
      "Descreva uma emoção que aparece de repente e some rápido.",
      "Imagine um desafio impossível que alguém precisa enfrentar.",
      "Conte sobre um encontro inesperado com uma criatura estranha.",
      "Descreva algo que você pode sentir, mas nunca viu.",
      "Fale sobre um objeto perdido que todos estão procurando.",
      "Imagine uma situação em que tudo está silencioso demais.",
      "Conte uma história que começa com um erro engraçado.",
      "Descreva um momento em que o tempo parece parar.",
      "Pense em algo que você viu hoje, mas tente descrever só uma parte.",
      "Imagine um lugar estranho onde você gostaria de estar agora.",
      "Conte algo engraçado que poderia acontecer num dia comum.",
      "Descreva um objeto comum de um jeito diferente ou inesperado.",
      "Fale sobre uma sensação que você já sentiu, mas usando outra coisa para explicar.",
      "Imagine um personagem que tenha um segredo curioso.",
      "Pense numa frase que poderia ser o título de um filme esquisito.",
      "Descreva uma cena de um sonho confuso que você já teve.",
      "Pense numa situação em que tudo dá errado, mas sem explicar o motivo.",
      "Descreva uma ação rápida que alguém poderia fazer numa história de aventura.",
      "Fale de algo que você gosta muito, mas sem dizer exatamente o que é.",
      "Imagine uma conversa estranha entre dois objetos inanimados.",
      "Conte uma pequena história usando só as emoções dos personagens.",
      "Descreva um som que ninguém mais pode ouvir, só você.",
      "Pense numa frase que começaria um mistério intrigante."
    ];

    function escolherPrompt() {
      return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    }

    function Rabiscofone() {
      const [tela, setTela] = useState('inicio');
      const [numJogadores, setNumJogadores] = useState(6);
      const [rodadaAtual, setRodadaAtual] = useState(1);
      const [promptAtual, setPromptAtual] = useState(null);
      const [mostrarPrompt, setMostrarPrompt] = useState(false);

      const totalRodadas = numJogadores;
      const proximaRodada = () => {
        if (rodadaAtual < totalRodadas) {
          setRodadaAtual(rodadaAtual + 1);
          setPromptAtual(null);
          setMostrarPrompt(false);
        } else {
          setTela('fim');
        }
      };

      const gerarPrompt = () => {
        setPromptAtual(escolherPrompt());
        setMostrarPrompt(true);
      };

      const esconderPrompt = () => {
        setMostrarPrompt(false);
        setTimeout(() => setPromptAtual(null), 300);
      };

      const reiniciarJogo = () => {
        setTela('inicio');
        setRodadaAtual(1);
        setPromptAtual(null);
        setMostrarPrompt(false);
      };

      // Tela Inicial
      if (tela === 'inicio') {
        return (
          <div className="container">
            <h1>✏️ Rabiscofone</h1>
            
            <div className="info-box">
              <h2>Como Jogar</h2>
              <ol className="rules-list">
                <li>Cada jogador escreve uma <strong>frase curta</strong> em seu papel.</li>
                <li>Passe o papel para o jogador à sua <strong>esquerda</strong>.</li>
                <li>Leia a frase que recebeu e <strong>desenhe</strong> uma ilustração que a represente.</li>
                <li><strong>Dobre</strong> a frase para ocultá-la, deixando apenas o desenho visível.</li>
                <li>Passe o papel novamente para a <strong>esquerda</strong>.</li>
                <li>Veja o desenho e <strong>escreva uma frase</strong> que o descreva.</li>
                <li>Continue alternando entre <strong>desenhar e escrever</strong>, sempre dobrando o anterior.</li>
                <li>O jogo termina quando os papéis <strong>retornam aos donos originais</strong>.</li>
                <li>Revele as sequências e <strong>divirta-se</strong> com as interpretações!</li>
              </ol>
            </div>

            <div className="info-box">
              <h3>Materiais Necessários</h3>
              <ul>
                <li>📄 Papel para cada jogador</li>
                <li>✏️ Caneta ou lápis para cada jogador</li>
                <li>📱 Este app para contar as rodadas</li>
              </ul>
            </div>

            <button className="btn" onClick={() => setTela('jogadores')}>
              🎮 Começar Jogo
            </button>
          </div>
        );
      }

      // Tela de Configuração
      if (tela === 'jogadores') {
        return (
          <div className="container">
            <h1>✏️ Rabiscofone</h1>
            
            <div className="info-box">
              <h2>Quantos jogadores?</h2>
              <p>O jogo funciona melhor com 6 a 12 jogadores, mas aceita de 4 em diante.</p>
              
              <input 
                type="range" 
                min="4" 
                max="15" 
                value={numJogadores}
                onChange={(e) => setNumJogadores(parseInt(e.target.value))}
                style={{width: '100%', margin: '20px 0'}}
              />
              
              <div className="player-count">{numJogadores}</div>
              
              <p style={{textAlign: 'center', color: '#6d28d9', fontSize: '18px'}}>
                O jogo terá <strong>{numJogadores} rodadas</strong> até os papéis retornarem aos donos.
              </p>
            </div>

            <button className="btn" onClick={() => setTela('jogo')}>
              ▶️ Iniciar Jogo
            </button>

            <button className="btn btn-secondary" onClick={() => setTela('inicio')}>
              ← Voltar
            </button>
          </div>
        );
      }

      // Tela do Jogo
      if (tela === 'jogo') {
        const ehPrimeiraRodada = rodadaAtual === 1;
        const ehUltimaRodada = rodadaAtual === totalRodadas;
        const ehRodadaPar = rodadaAtual % 2 === 0;
        const acao = ehPrimeiraRodada ? 'Escrever Frase Inicial' : (ehRodadaPar ? 'Escrever Frase' : 'Desenhar');

        return (
          <div className="container">
            <h1>✏️ Rabiscofone</h1>

            <div className="round-indicator">
              <div className="round-label">Rodada</div>
              <div className="round-number">{rodadaAtual}</div>
              <div className="round-label">de {totalRodadas}</div>
            </div>

            <div className="info-box">
              <h2>📋 Ação desta rodada:</h2>
              <p style={{fontSize: '24px', fontWeight: 'bold', color: '#7c3aed', textAlign: 'center', margin: '20px 0'}}>
                {acao}
              </p>

              {ehPrimeiraRodada && (
                <div className="warning">
                  <strong>⚠️ Primeira rodada:</strong> Cada jogador escreve uma frase inicial em seu próprio papel.
                </div>
              )}

              {!ehPrimeiraRodada && !ehRodadaPar && (
                <div className="warning">
                  <strong>🎨 Desenhar:</strong> Olhe a frase que recebeu e desenhe. Depois dobre a frase para ocultá-la.
                </div>
              )}

              {!ehPrimeiraRodada && ehRodadaPar && (
                <div className="warning">
                  <strong>✍️ Escrever:</strong> Olhe o desenho e escreva uma frase descrevendo-o. Depois dobre o desenho.
                </div>
              )}

              {ehUltimaRodada && (
                <div className="success">
                  <strong>🎉 Última rodada!</strong><br/>
                  Após esta rodada, os papéis retornam aos donos e vocês podem revelar as sequências!
                </div>
              )}
            </div>

            {!ehPrimeiraRodada && (
              <div className="info-box" style={{background: '#f0fdf4'}}>
                <p style={{margin: 0, textAlign: 'center', color: '#065f46', fontWeight: 'bold'}}>
                  ⬅️ Passe o papel para a esquerda
                </p>
              </div>
            )}

            {mostrarPrompt && promptAtual && (
              <div className="prompt-box">
                <h3 style={{margin: '0 0 15px 0', color: '#92400e'}}>💡 Prompt Sugerido:</h3>
                <p className="prompt-text">{promptAtual}</p>
                <button className="btn btn-danger" onClick={esconderPrompt}>
                  🗑️ Apagar Prompt
                </button>
                <p style={{textAlign: 'center', fontSize: '14px', color: '#92400e', marginTop: '10px'}}>
                  Use este botão para impedir que outros jogadores vejam o prompt!
                </p>
              </div>
            )}

            {ehPrimeiraRodada && !mostrarPrompt && (
              <button className="btn btn-success" onClick={gerarPrompt}>
                💡 Preciso de um Prompt
              </button>
            )}

            <button className="btn" onClick={proximaRodada}>
              {ehUltimaRodada ? '🎉 Finalizar Jogo' : '➡️ Próxima Rodada'}
            </button>

            <button 
              className="btn btn-secondary" 
              onClick={() => {
                if (confirm('Reiniciar o jogo? Todo o progresso será perdido.')) {
                  reiniciarJogo();
                }
              }}
            >
              🔄 Reiniciar Jogo
            </button>
          </div>
        );
      }

      // Tela Final
      if (tela === 'fim') {
        return (
          <div className="container">
            <h1>✏️ Rabiscofone</h1>

            <div className="success">
              <h2 style={{color: '#065f46', marginTop: 0}}>🎉 Jogo Completo!</h2>
              <p style={{fontSize: '20px', color: '#065f46'}}>
                Os papéis retornaram aos donos originais.
              </p>
            </div>

            <div className="info-box">
              <h2>📖 Hora da Revelação!</h2>
              <ol className="rules-list">
                <li>Cada jogador, <strong>um por vez</strong>, mostra a última interpretação em seu papel.</li>
                <li>Peça aos outros para <strong>adivinharem</strong> o que é.</li>
                <li>Revele a interpretação <strong>anterior</strong> e continue até chegar à frase inicial.</li>
                <li><strong>Riam e divirtam-se</strong> com as transformações!</li>
              </ol>
            </div>

            <button className="btn" onClick={reiniciarJogo}>
              🔄 Jogar Novamente
            </button>

            <button className="btn btn-secondary" onClick={() => setTela('inicio')}>
              🏠 Voltar ao Início
            </button>
          </div>
        );
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Rabiscofone />);
  </script>
</body>
</html>
