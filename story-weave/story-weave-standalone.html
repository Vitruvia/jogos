<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Weave - Jogo de Narrativa Colaborativa</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out;
    }
    
    .animate-slideDown {
      animation: slideDown 0.5s ease-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;

    // Ícones SVG inline (substituindo Lucide)
    const Icons = {
      Shuffle: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
      ),
      RefreshCw: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      ),
      Settings: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      BookOpen: () => (
        <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      ),
      Sparkles: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      ),
      Users: () => (
        <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      Crown: () => (
        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
      )
    };

    // Dicionário de palavras com raridade
    const DICIONARIO = {
      substantivos: {
        geral: [
          {palavra: 'casa', raridade: 1}, {palavra: 'porta', raridade: 1}, {palavra: 'caminho', raridade: 1}, {palavra: 'noite', raridade: 1},
          {palavra: 'livro', raridade: 2}, {palavra: 'sombra', raridade: 2}, {palavra: 'carta', raridade: 2}, {palavra: 'janela', raridade: 2},
          {palavra: 'floresta', raridade: 3}, {palavra: 'portal', raridade: 3}, {palavra: 'relógio', raridade: 3}, {palavra: 'torre', raridade: 3},
          {palavra: 'labirinto', raridade: 4}, {palavra: 'obelisco', raridade: 4}
        ],
        misterio: [
          {palavra: 'pista', raridade: 1}, {palavra: 'segredo', raridade: 2}, {palavra: 'enigma', raridade: 2},
          {palavra: 'código', raridade: 3}, {palavra: 'conspiração', raridade: 3}
        ],
        aventura: [
          {palavra: 'montanha', raridade: 1}, {palavra: 'tesouro', raridade: 2}, {palavra: 'caverna', raridade: 2},
          {palavra: 'bússola', raridade: 3}, {palavra: 'tempestade', raridade: 3}
        ],
        fantasia: [
          {palavra: 'magia', raridade: 1}, {palavra: 'dragão', raridade: 2}, {palavra: 'feitiço', raridade: 2},
          {palavra: 'oráculo', raridade: 3}, {palavra: 'grimório', raridade: 4}
        ],
        cotidiano: [
          {palavra: 'café', raridade: 1}, {palavra: 'parque', raridade: 1}, {palavra: 'estação', raridade: 2},
          {palavra: 'fotografia', raridade: 3}, {palavra: 'almanaque', raridade: 4}
        ]
      },
      verbos: [
        {palavra: 'correr', raridade: 1}, {palavra: 'ver', raridade: 1}, {palavra: 'falar', raridade: 1},
        {palavra: 'descobrir', raridade: 2}, {palavra: 'sussurrar', raridade: 2}, {palavra: 'transformar', raridade: 2},
        {palavra: 'perceber', raridade: 3}, {palavra: 'hesitar', raridade: 3}, {palavra: 'vislumbrar', raridade: 4}
      ],
      adjetivos: [
        {palavra: 'grande', raridade: 1}, {palavra: 'escuro', raridade: 1},
        {palavra: 'antigo', raridade: 2}, {palavra: 'misterioso', raridade: 2}, {palavra: 'brilhante', raridade: 2},
        {palavra: 'transparente', raridade: 3}, {palavra: 'nostálgico', raridade: 3}, {palavra: 'diáfano', raridade: 4}
      ],
      conectores: [
        {palavra: 'através', raridade: 2}, {palavra: 'entre', raridade: 2}, {palavra: 'dentro', raridade: 2},
        {palavra: 'além', raridade: 3}, {palavra: 'durante', raridade: 3}, {palavra: 'apesar', raridade: 3}
      ],
      outros: [
        {palavra: 'nunca', raridade: 1}, {palavra: 'sempre', raridade: 1},
        {palavra: 'súbito', raridade: 2}, {palavra: 'finalmente', raridade: 2}, {palavra: 'talvez', raridade: 2},
        {palavra: 'certamente', raridade: 3}, {palavra: 'jamais', raridade: 4}
      ]
    };

    const PERSONAGENS = {
      nomes: ['Marina', 'Lucas', 'Sofia', 'Diego', 'Aurora', 'Dante', 'Íris', 'Theo', 'Luna', 'Atlas'],
      profissoes: ['arquiteta', 'detetive', 'professor', 'artista', 'cientista', 'jornalista', 'músico', 'chef'],
      tracos: ['perfeccionista', 'impulsivo', 'observador', 'sonhador', 'cético', 'corajoso', 'cauteloso'],
      habilidades: ['memória fotográfica', 'intuição aguçada', 'talento artístico', 'reflexos rápidos'],
      defeitos: ['teme alturas', 'não confia em ninguém', 'evita confrontos', 'mente compulsivo'],
      lugares: ['terraço de arranha-céu', 'biblioteca antiga', 'estação de trem', 'galeria de arte', 'floresta nebulosa'],
      eventos: ['as luzes apagaram', 'encontrou uma carta misteriosa', 'ouviu um som estranho', 'o relógio parou']
    };

    const TEMAS_CHECKPOINT = [
      { nome: 'Ação', cor: '#e74c3c', palavra: 'SÚBITO' },
      { nome: 'Mistério', cor: '#9b59b6', palavra: 'PORÉM' },
      { nome: 'Revelação', cor: '#f39c12', palavra: 'FINALMENTE' }
    ];

    function StoryWeave() {
      const [tela, setTela] = useState('inicio');
      const [personagem, setPersonagem] = useState(null);
      const [personagemVisivel, setPersonagemVisivel] = useState(true);
      const [palavrasAtuais, setPalavrasAtuais] = useState([]);
      const [historico, setHistorico] = useState([]);
      const [numeroJogadores, setNumeroJogadores] = useState(3);
      const [jogadorAtual, setJogadorAtual] = useState(1);
      const [rodadaAtual, setRodadaAtual] = useState(1);
      const [turnoNaRodada, setTurnoNaRodada] = useState(1);
      const [checkpointProximo, setCheckpointProximo] = useState(false);
      const [config, setConfig] = useState({
        quantidadePalavras: 6,
        tema: 'geral',
        checkpointACada: 3
      });

      const escolher = (arr) => arr[Math.floor(Math.random() * arr.length)];

      const gerarPersonagem = () => {
        const p = {
          nome: escolher(PERSONAGENS.nomes),
          profissao: escolher(PERSONAGENS.profissoes),
          traco: escolher(PERSONAGENS.tracos),
          habilidade: escolher(PERSONAGENS.habilidades),
          defeito: escolher(PERSONAGENS.defeitos),
          lugar: escolher(PERSONAGENS.lugares),
          evento: escolher(PERSONAGENS.eventos)
        };
        setPersonagem(p);
        return p;
      };

      const calcularPeso = (palavraObj, tema) => {
        let peso = 1.0;
        const palavra = palavraObj.palavra;
        const recentes = historico.slice(-20);
        const vezesUsada = recentes.filter(p => p === palavra).length;
        peso *= Math.exp(-0.5 * vezesUsada);
        if (tema !== 'geral' && palavraObj.tematico) {
          peso *= 1.8;
        }
        return peso;
      };

      const selecionarComPesos = (palavras, quantidade) => {
        const qtdRaridade1 = Math.round(quantidade * 0.15);
        const qtdRaridade2 = Math.round(quantidade * 0.30);
        const qtdRaridade3 = Math.round(quantidade * 0.30);
        const qtdRaridade4 = Math.round(quantidade * 0.15);
        const qtdQualquer = quantidade - (qtdRaridade1 + qtdRaridade2 + qtdRaridade3 + qtdRaridade4);
        
        const selecionadas = [];
        
        const selecionarPorRaridade = (raridade, qtd) => {
          const candidatos = palavras
            .filter(p => p.raridade === raridade)
            .map(p => ({...p, peso: calcularPeso(p, config.tema)}))
            .sort((a, b) => b.peso - a.peso);
          
          if (candidatos.length === 0) return [];
          
          const topCandidatos = candidatos.slice(0, Math.min(qtd * 3, candidatos.length));
          const embaralhados = topCandidatos.sort(() => Math.random() - 0.5);
          
          return embaralhados.slice(0, Math.min(qtd, embaralhados.length));
        };
        
        selecionadas.push(...selecionarPorRaridade(1, qtdRaridade1));
        selecionadas.push(...selecionarPorRaridade(2, qtdRaridade2));
        selecionadas.push(...selecionarPorRaridade(3, qtdRaridade3));
        selecionadas.push(...selecionarPorRaridade(4, qtdRaridade4));
        
        if (qtdQualquer > 0 && selecionadas.length < quantidade) {
          const jaSelecionadas = new Set(selecionadas.map(p => p.palavra));
          const candidatos = palavras
            .filter(p => !jaSelecionadas.has(p.palavra))
            .map(p => ({...p, peso: calcularPeso(p, config.tema)}))
            .sort((a, b) => b.peso - a.peso);
          
          const topCandidatos = candidatos.slice(0, Math.min(qtdQualquer * 3, candidatos.length));
          const embaralhados = topCandidatos.sort(() => Math.random() - 0.5);
          
          selecionadas.push(...embaralhados.slice(0, Math.min(qtdQualquer, embaralhados.length)));
        }
        
        return selecionadas.map(p => p.palavra);
      };

      const gerarPalavras = () => {
        const novasPalavras = [];
        
        let poolSubstantivos = DICIONARIO.substantivos.geral.map(p => ({...p, tematico: false}));
        if (config.tema !== 'geral' && DICIONARIO.substantivos[config.tema]) {
          const tematicos = DICIONARIO.substantivos[config.tema].map(p => ({...p, tematico: true}));
          poolSubstantivos = [...poolSubstantivos, ...tematicos];
        }
        novasPalavras.push(...selecionarComPesos(poolSubstantivos, 2));
        
        novasPalavras.push(...selecionarComPesos(DICIONARIO.verbos, 2));
        novasPalavras.push(...selecionarComPesos(DICIONARIO.adjetivos, 1));
        novasPalavras.push(...selecionarComPesos(DICIONARIO.conectores, 1));
        
        const embaralhadas = novasPalavras.sort(() => Math.random() - 0.5);
        
        setPalavrasAtuais(embaralhadas);
        setHistorico(prev => [...prev, ...embaralhadas]);
        
        const proximoJogador = jogadorAtual === numeroJogadores ? 1 : jogadorAtual + 1;
        const proximoTurno = turnoNaRodada + 1;
        
        setJogadorAtual(proximoJogador);
        
        if (proximoJogador === 1 && turnoNaRodada === numeroJogadores) {
          setRodadaAtual(prev => prev + 1);
          setTurnoNaRodada(1);
          
          if ((rodadaAtual + 1) % config.checkpointACada === 0) {
            setCheckpointProximo(true);
          } else {
            setCheckpointProximo(false);
          }
        } else {
          setTurnoNaRodada(proximoTurno);
        }
      };

      const iniciarJogo = () => {
        gerarPersonagem();
        setTela('jogo');
        setRodadaAtual(1);
        setJogadorAtual(1);
        setTurnoNaRodada(1);
        setHistorico([]);
        setPalavrasAtuais([]);
        setCheckpointProximo(false);
        setPersonagemVisivel(true);
      };

      // Tela de início
      if (tela === 'inicio') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6 flex items-center justify-center">
            <div className="max-w-md w-full">
              <div className="text-center mb-12 animate-fadeIn">
                <div className="mx-auto mb-4 text-amber-800">
                  <Icons.BookOpen />
                </div>
                <h1 className="text-6xl font-bold mb-2 text-amber-900">Story Weave</h1>
                <p className="text-amber-700 text-lg italic">Teça histórias colaborativas</p>
              </div>
              
              <div className="bg-white/80 backdrop-blur rounded-2xl p-8 shadow-xl border border-amber-200">
                <h2 className="text-2xl font-semibold mb-4 text-amber-900">Como Jogar</h2>
                <ol className="space-y-3 text-amber-800 mb-6">
                  <li className="flex gap-3">
                    <span className="font-bold text-amber-600">1.</span>
                    <span>Defina quantos jogadores participarão</span>
                  </li>
                  <li className="flex gap-3">
                    <span className="font-bold text-amber-600">2.</span>
                    <span>Um personagem inicial será gerado automaticamente</span>
                  </li>
                  <li className="flex gap-3">
                    <span className="font-bold text-amber-600">3.</span>
                    <span>Cada jogador recebe 6 palavras e cria frases usando pelo menos 3 delas</span>
                  </li>
                  <li className="flex gap-3">
                    <span className="font-bold text-amber-600">4.</span>
                    <span>O líder da rodada recebe uma palavra especial nos checkpoints</span>
                  </li>
                </ol>
                
                <button
                  onClick={() => setTela('jogadores')}
                  className="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
                >
                  <Icons.Sparkles />
                  Começar Nova História
                </button>
                
                <button
                  onClick={() => setTela('config')}
                  className="w-full mt-3 bg-white/50 text-amber-800 py-3 rounded-xl font-medium border border-amber-300 hover:bg-white/70 transition-all duration-200 flex items-center justify-center gap-2"
                >
                  <Icons.Settings />
                  Configurações
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Tela de seleção de jogadores
      if (tela === 'jogadores') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6 flex items-center justify-center">
            <div className="max-w-md w-full">
              <button onClick={() => setTela('inicio')} className="mb-6 text-amber-700 hover:text-amber-900">
                ← Voltar
              </button>

              <div className="bg-white/80 backdrop-blur rounded-2xl p-8 shadow-xl border border-amber-200">
                <div className="text-center mb-8">
                  <div className="mx-auto mb-4 text-amber-600">
                    <Icons.Users />
                  </div>
                  <h2 className="text-3xl font-bold mb-2 text-amber-900">Quantos jogadores?</h2>
                  <p className="text-amber-700">Selecione o número de participantes</p>
                </div>

                <div className="mb-8">
                  <input
                    type="range"
                    min="2"
                    max="8"
                    value={numeroJogadores}
                    onChange={(e) => setNumeroJogadores(parseInt(e.target.value))}
                    className="w-full"
                  />
                  <div className="text-center mt-4">
                    <div className="text-6xl font-bold text-amber-700 mb-2">{numeroJogadores}</div>
                    <div className="text-amber-600">{numeroJogadores === 1 ? 'jogador' : 'jogadores'}</div>
                  </div>
                </div>

                <button
                  onClick={iniciarJogo}
                  className="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-4 rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all"
                >
                  <Icons.Sparkles /> Começar História
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Tela de configurações
      if (tela === 'config') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-6">
            <div className="max-w-md mx-auto">
              <button onClick={() => setTela('inicio')} className="mb-6 text-amber-700 hover:text-amber-900">
                ← Voltar
              </button>
              
              <div className="bg-white/80 backdrop-blur rounded-2xl p-8 shadow-xl border border-amber-200">
                <h2 className="text-3xl font-bold mb-6 text-amber-900">Configurações</h2>
                
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-semibold text-amber-800 mb-2">
                      Quantidade de Palavras
                    </label>
                    <input
                      type="range"
                      min="4"
                      max="8"
                      value={config.quantidadePalavras}
                      onChange={(e) => setConfig({...config, quantidadePalavras: parseInt(e.target.value)})}
                      className="w-full"
                    />
                    <div className="text-center text-2xl font-bold text-amber-700 mt-2">
                      {config.quantidadePalavras}
                    </div>
                  </div>
                  
                  <div>
                    <label className="block text-sm font-semibold text-amber-800 mb-2">Tema</label>
                    <select
                      value={config.tema}
                      onChange={(e) => setConfig({...config, tema: e.target.value})}
                      className="w-full p-3 rounded-lg border border-amber-300 bg-white/70 text-amber-900 font-medium"
                    >
                      <option value="geral">Geral (Variado)</option>
                      <option value="misterio">Mistério</option>
                      <option value="aventura">Aventura</option>
                      <option value="fantasia">Fantasia</option>
                      <option value="cotidiano">Cotidiano</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-semibold text-amber-800 mb-2">
                      Checkpoint a cada X rodadas
                    </label>
                    <input
                      type="range"
                      min="2"
                      max="5"
                      value={config.checkpointACada}
                      onChange={(e) => setConfig({...config, checkpointACada: parseInt(e.target.value)})}
                      className="w-full"
                    />
                    <div className="text-center text-2xl font-bold text-amber-700 mt-2">
                      {config.checkpointACada} {config.checkpointACada === 1 ? 'rodada' : 'rodadas'}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // Tela do jogo
      const ehLider = jogadorAtual === 1;
      const progressoRodada = ((turnoNaRodada - 1) / numeroJogadores) * 100;

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 p-4 pb-20">
          <div className="max-w-2xl mx-auto">
            {/* Header */}
            <div className="flex justify-between items-start mb-6">
              <div>
                <h1 className="text-2xl font-bold text-amber-900">Story Weave</h1>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-sm text-amber-700">Rodada {rodadaAtual}</span>
                  <span className="text-amber-400">•</span>
                  <span className="text-sm text-amber-700">Turno {turnoNaRodada}/{numeroJogadores}</span>
                </div>
              </div>
              <button
                onClick={() => {
                  if (confirm('Iniciar nova história?')) {
                    setTela('inicio');
                  }
                }}
                className="p-2 text-amber-700 hover:text-amber-900 transition-colors"
              >
                <Icons.RefreshCw />
              </button>
            </div>

            {/* Barra de progresso */}
            <div className="mb-6 bg-white/50 rounded-full h-2 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-500" style={{width: `${progressoRodada}%`}} />
            </div>

            {/* Indicador de jogador */}
            <div className={`mb-6 rounded-2xl p-4 shadow-md border-2 ${ehLider ? 'bg-gradient-to-r from-yellow-100 to-amber-100 border-amber-400' : 'bg-white/70 border-amber-200'}`}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  {ehLider && <Icons.Crown />}
                  <div>
                    <div className="text-sm text-amber-600 font-medium">
                      {ehLider ? 'Líder da Rodada' : 'Jogador Atual'}
                    </div>
                    <div className="text-2xl font-bold text-amber-900">Jogador {jogadorAtual}</div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-xs text-amber-600">Próximo</div>
                  <div className="text-lg font-semibold text-amber-800">
                    Jogador {jogadorAtual === numeroJogadores ? 1 : jogadorAtual + 1}
                  </div>
                </div>
              </div>
            </div>

            {/* Personagem */}
            {personagem && (
              <div className="mb-6">
                <button
                  onClick={() => setPersonagemVisivel(!personagemVisivel)}
                  className="w-full bg-gradient-to-r from-amber-100 to-orange-100 rounded-2xl p-4 shadow-lg border-2 border-amber-300 transition-all hover:shadow-xl"
                >
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <Icons.Sparkles />
                      <h3 className="text-lg font-bold text-amber-900">Personagem Principal</h3>
                    </div>
                    <div className="text-amber-600 font-bold">{personagemVisivel ? '−' : '+'}</div>
                  </div>
                </button>
                
                {personagemVisivel && (
                  <div className="bg-gradient-to-r from-amber-50 to-orange-50 rounded-b-2xl p-6 pt-4 border-2 border-t-0 border-amber-300 animate-slideDown">
                    <p className="text-amber-800 leading-relaxed text-lg">
                      <strong>{personagem.nome}</strong>, {personagem.profissao} {personagem.traco} com {personagem.habilidade}, 
                      mas {personagem.defeito}, estava em {personagem.lugar} quando {personagem.evento}.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* Checkpoint */}
            {checkpointProximo && ehLider && (
              <div className="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-6 mb-6 shadow-lg border-2 border-purple-300">
                <div className="flex items-center gap-3 mb-3">
                  <Icons.Crown />
                  <div>
                    <h3 className="text-xl font-bold text-purple-900">🎲 Checkpoint!</h3>
                    <p className="text-purple-800">Como líder desta rodada, você deve criar uma reviravolta!</p>
                  </div>
                </div>
                <div className="mt-3 p-3 bg-white/50 rounded-lg">
                  <p className="text-sm text-purple-700 mb-1">Palavra especial:</p>
                  <p className="text-2xl font-bold" style={{color: escolher(TEMAS_CHECKPOINT).cor}}>
                    {escolher(TEMAS_CHECKPOINT).palavra}
                  </p>
                </div>
              </div>
            )}

            {/* Palavras */}
            {palavrasAtuais.length > 0 ? (
              <div className="mb-6">
                <h3 className="text-lg font-semibold text-amber-900 mb-4">
                  Use pelo menos 3 destas palavras:
                </h3>
                <div className="grid grid-cols-2 gap-3">
                  {palavrasAtuais.map((palavra, idx) => (
                    <div
                      key={idx}
                      className="bg-white rounded-xl p-4 shadow-md border-2 border-amber-200 hover:border-amber-400 transition-all hover:scale-105 cursor-pointer"
                      style={{
                        animationDelay: `${idx * 0.05}s`,
                        animation: 'slideUp 0.4s ease-out forwards',
                        opacity: 0
                      }}
                    >
                      <p className="text-2xl font-bold text-amber-900 text-center">{palavra}</p>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div className="bg-white/60 rounded-2xl p-12 text-center mb-6 border-2 border-dashed border-amber-300">
                <div className="mx-auto mb-4 text-amber-400">
                  <Icons.Shuffle />
                </div>
                <p className="text-amber-700 text-lg">
                  Gere palavras para {rodadaAtual === 1 && turnoNaRodada === 1 ? 'começar a história' : 'continuar'}
                </p>
              </div>
            )}

            {/* Botão gerar */}
            <button
              onClick={gerarPalavras}
              className="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-5 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105 flex items-center justify-center gap-3"
            >
              <Icons.Shuffle />
              {palavrasAtuais.length > 0 ? 'Passar para Próximo Jogador' : 'Gerar Palavras'}
            </button>

            {palavrasAtuais.length > 0 && (
              <div className="mt-4 text-center text-sm text-amber-600 italic">
                Após narrar sua parte da história, clique no botão acima
              </div>
            )}
          </div>
        </div>
      );
    }

    // Renderizar o app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StoryWeave />);
  </script>
</body>
</html>
